<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#eee;padding:24px}
h1{font-size:22px;margin:0 0 14px;color:#2a1d14}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.c{background:#fff;border-radius:10px;padding:12px;text-align:center;border:2px dashed #ccc}
.c img{width:100%}.c b{display:block;color:#b5462a;font-size:18px}.c small{color:#777}
</style></head><body><h1>Mama Pendo's Kitchen — table QR codes (print &amp; cut)</h1><div class="g" id="g"></div>
<script>for(let i=1;i<=10;i++)document.getElementById('g').innerHTML+=`<div class="c"><img src="qr/t${i}.png"><b>Table ${i}</b><small>Scan to order</small></div>`</script></body></html>
